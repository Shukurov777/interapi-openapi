openapi: 3.1.0
info:
  title: InterAPI
  version: 2.0.0
  summary: 'Social media downloader API: Instagram, TikTok, YouTube, X (Twitter), Facebook, Pinterest, RuTube, Likee,
    YouTube search and Shazam.'
  description: |
    **InterAPI** is a REST API that turns links from **Instagram, TikTok, YouTube, X (Twitter), Facebook, Pinterest, RuTube and Likee** into JSON with direct video, photo and audio URLs. It also offers **YouTube search** (videos, music, playlists, channels) and **Shazam music recognition** from a URL or an uploaded file. One universal endpoint, `GET /api/v1/auto`, detects the platform from any supported link.

    Typical uses: Telegram bots, video downloader apps and sites, media archiving, social media tools, music recognition.

    ## Quick start

    1. Create an account at [interapi.dev](https://interapi.dev/) and copy your API key. **1,000 free credits** on sign-up.
    2. Send a request:

    ```bash
    curl -G "https://api.interapi.dev/api/v1/auto" \
      --data-urlencode "url=https://vt.tiktok.com/ZSQrfS4U7/" \
      -H "X-API-Key: YOUR_API_KEY"
    ```

    ## Authentication

    Send your key in the `X-API-Key` header. `Authorization: Bearer ia_live_...` also works, and so does the `?api=ia_live_...` query parameter - use it when a third-party client (for example Telegram) downloads a file by URL and cannot send headers. The catalog, status and health endpoints need no key.

    ## Credits and pricing

    You pay per successful request in **credits**: **5 to 15 credits** depending on the API (Instagram and TikTok 6, YouTube 15, YouTube search 6, other platforms and Shazam 5; `/api/v1/auto` costs as the platform it detects).

    * `5xx` answers are **free**.
    * `4xx` answers (bad link, deleted post) cost **at most 1 credit**.
    * Missing or invalid parameters (`422`) and authentication errors are not charged.
    * File proxies (`/api/v1/media/file`, `/api/v1/media/thumb`, `/api/v1/youtube/file`) and `/api/v1/account` are free.
    * Credits **never expire**, there is **no subscription**. See [pricing](https://interapi.dev/en/pricing/).
    * Free credits are limited to **30 requests per hour** until the first top-up.

    Every metered response carries `X-Request-Cost` and `X-Balance-Remaining` headers.

    ## Response codes

    | Code | Meaning |
    |------|---------|
    | `200` | Success. The request price is charged. |
    | `400` | Invalid or unsupported link. |
    | `401` | API key missing or invalid. |
    | `402` | Out of credits - [top up](https://interapi.dev/en/pricing/). |
    | `403` | Private content or disabled account. |
    | `404` | Post not found (deleted or unavailable). |
    | `422` | Missing or invalid query parameter. |
    | `429` | Rate limit exceeded (see `Retry-After`). |
    | `502` / `5xx` | Source platform or server problem. Not charged - retry. |

    All errors share one JSON shape: `{"detail": "...", "request_id": "..."}`.

    ## Links

    * Website: <https://interapi.dev/>
    * Documentation: <https://interapi.dev/en/docs/>
    * Pricing: <https://interapi.dev/en/pricing/>
    * Status: <https://interapi.dev/en/status/>

    InterAPI is an independent service and is not affiliated with Instagram, TikTok, YouTube, X, Facebook, Pinterest, RuTube, Likee or Shazam. Names and logos belong to their owners.
