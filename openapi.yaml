paths:
  /api/v1/auto:
    get:
      tags:
      - Auto-detect
      operationId: getMediaAuto
      summary: Download media from any supported link (platform auto-detected)
      description: |-
        Send one link from **Instagram, TikTok, Pinterest, YouTube (including Shorts and Music), Likee, X (Twitter), Facebook or RuTube**. The platform is detected from the URL and the answer has the same shape as the matching endpoint plus the `source` field.

        **Price: 5 credits** per successful request. A `4xx` answer costs at most 1 credit, a `5xx` answer is free. `/api/v1/auto` costs as much as the platform it resolves to: 5 credits for most platforms, 6 for Instagram and TikTok, 15 for YouTube.
      x-credits: 5
      x-credits-max: 15
      parameters:
      - name: url
        in: query
        required: true
        description: Link to a post or video on any supported platform (Instagram, TikTok, Pinterest, YouTube, Likee,
          X, Facebook, RuTube). Share text that contains a link is accepted too.
        schema:
          type: string
          maxLength: 2048
        example: https://vt.tiktok.com/ZSQrfS4U7/
      responses:
        '200':
          description: Media files of the detected platform. `source` tells which platform was detected.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-Request-Cost:
              $ref: '#/components/headers/X-Request-Cost'
            X-Balance-Remaining:
              $ref: '#/components/headers/X-Balance-Remaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoMediaResponse'
              examples:
                tiktok:
                  summary: TikTok link detected
                  value:
                    status: success
                    platform: InterAPI
                    title: 'Любите маринад с уксусом? #рецепты #рецептынановыйгод'
                    description: 'Любите маринад с уксусом? #рецепты #рецептынановыйгод'
