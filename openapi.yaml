  /api/v1/youtube/file:
    get:
      tags:
      - Files
      operationId: downloadYouTubeFile
      summary: Download a YouTube audio or video file
      description: |-
        Returns the media file itself instead of a CDN link. With `mode=auto` (default) the request is answered with a `307` redirect to the fastest working CDN URL; with `mode=file` the file is proxied or downloaded by the server and streamed in the response body. Use `kind=audio` for M4A/MP3 and `kind=video` for MP4.

        **Free:** file downloads cost no credits (the metadata request that produced the link was already charged). A valid API key is still required - pass it as the `api` query parameter when the client cannot send headers, e.g. Telegram fetching a file by URL.
      x-credits: 0
      parameters:
      - name: url
        in: query
        required: true
        description: YouTube or YouTube Music link.
        schema:
          type: string
          maxLength: 2048
        example: https://youtu.be/UFk4_Ybx7yk
      - name: kind
        in: query
        required: false
        description: Audio or video stream.
        schema:
          type: string
          enum:
          - audio
          - video
          default: audio
        example: audio
      - name: format_id
        in: query
        required: false
        description: Format id (`format_id` / itag from `GET /api/v1/youtube`) or `best`.
        schema:
          type: string
          default: best
        example: best
      - name: mode
        in: query
        required: false
        description: '`auto` - redirect to the CDN; `file` - stream the file through InterAPI.'
        schema:
          type: string
          enum:
          - auto
          - file
          default: auto
        example: auto
      responses:
        '200':
          description: The media file (`mode=file`).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            audio/mp4:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/webm:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
        '307':
          description: Redirect to the CDN file (`mode=auto`). Follow it (`curl -L`).
          headers:
            Location:
              description: CDN URL of the file.
