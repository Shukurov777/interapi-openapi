  /api/v1/youtube:
    get:
      tags:
      - YouTube
      operationId: getYouTubeVideo
      summary: Download YouTube video and audio (MP4, WebM, M4A, Opus)
      description: |-
        Accepts `youtube.com`, `youtu.be`, Shorts and `music.youtube.com` links. Returns `title`, `author`, `duration_sec`, the thumbnail and the full list of available formats in `media`: MP4 / WebM video in several resolutions and M4A / Opus audio-only streams. Every item carries `format_id` (itag), `height`, `ext` and `bitrate`.

        Use [`GET /api/v1/youtube/file`](#operation/downloadYouTubeFile) to receive the file itself instead of a CDN link.

        **Price: 15 credits** per successful request. A `4xx` answer costs at most 1 credit, a `5xx` answer is free.
      x-credits: 15
      parameters:
      - name: url
