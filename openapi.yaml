      - Instagram
      operationId: getInstagramMedia
      summary: Download Instagram Reels, videos, photos and carousels
      description: |-
        Extracts media from **public** Instagram posts, Reels and multi-slide carousels. The `media` array holds one item per file (and per available size for photos) with `type` (`video` or `photo`), a direct file URL and a quality label. `video_url` / `video_hd_url` point at the main video and `thumbnail` at the preview image.

        Private accounts and stories are not available.

        **Price: 6 credits** per successful request. A `4xx` answer costs at most 1 credit, a `5xx` answer is free.
      x-credits: 6
      parameters:
      - name: url
        in: query
        required: true
        description: Public HTTPS link to an Instagram post or Reel (`instagram.com/p/...` or `/reel/...`).
        schema:
          type: string
          maxLength: 2048
        example: https://www.instagram.com/p/C2VFqJMtui4/
      - name: type
        in: query
        required: false
        description: Content type hint for the parser. The default `media` works for photos and videos.
        schema:
