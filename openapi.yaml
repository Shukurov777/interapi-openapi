      parameters:
      - name: source
        in: query
        required: false
        description: Platform of the link. Use together with `url`.
        schema:
          type: string
          enum:
          - instagram
          - tiktok
          - pinterest
          - likee
          - x
          - facebook
          - rutube
        example: tiktok
      - name: url
        in: query
        required: false
        description: Original post URL. Use together with `source`.
        schema:
          type: string
          maxLength: 2048
        example: https://vt.tiktok.com/ZSQrfS4U7/
      - name: p
        in: query
        required: false
        description: Short token that encodes `source` and `url`. Alternative to passing `source` + `url`.
        schema:
          type: string
      responses:
