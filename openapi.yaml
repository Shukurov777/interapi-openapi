components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your API key, e.g. `ia_live_...`. Get a key with 1,000 free credits at <https://interapi.dev/>.
        Send it in the `X-API-Key` header.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ia_live_...
      description: 'The same key as `Authorization: Bearer ia_live_...`.'
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api
      description: The same key as the `?api=ia_live_...` query parameter (`api_key` is accepted too). Use it when
        a third-party client fetches a URL without custom headers, e.g. Telegram downloading a file. Never expose
        it in public front-end code.
  headers:
    X-Request-Id:
      description: Unique id of the request. Send your own `X-Request-Id` to correlate logs.
      schema:
        type: string
      example: d33641f69d264233b867da8081d6fcca
    X-Request-Cost:
      description: Credits charged for this request (`0` for free answers and unlimited keys).
      schema:
        type: integer
      example: 6
    X-Balance-Remaining:
      description: Credit balance after this request.
      schema:
        type: integer
      example: 994
    X-RateLimit-Limit:
      description: Requests allowed per hour. Sent only for accounts with an hourly limit (free credits before the
        first top-up).
      schema:
        type: integer
      example: 30
    X-RateLimit-Remaining:
      description: Requests left in the current hourly window.
      schema:
        type: integer
      example: 23
    X-RateLimit-Reset:
      description: Unix time when the hourly window resets.
      schema:
        type: integer
      example: 1795014000
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
      example: 120
  responses:
    BadRequest:
      description: Invalid or unsupported link (or a missing / malformed parameter). Costs at most 1 credit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_url:
              summary: Link does not belong to the platform
              value:
                detail: Invalid TikTok URL
                request_id: d33641f69d264233b867da8081d6fcca
            unsupported:
              summary: '`/api/v1/auto` got an unknown link'
              value:
                detail: 'Unsupported link: expected an Instagram, TikTok, Pinterest, YouTube, Likee, X, Facebook
                  or RuTube URL'
                request_id: d33641f69d264233b867da8081d6fcca
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
    Unauthorized:
      description: API key is missing or invalid. Free of charge.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              summary: No key sent
              value:
                detail: API key required. Pass ?api=YOUR_KEY in query string or X-API-Key header. Get a key at interapi.dev/dashboard
                request_id: d33641f69d264233b867da8081d6fcca
            invalid:
              summary: Unknown or revoked key
              value:
                detail: Invalid API key
                request_id: d33641f69d264233b867da8081d6fcca
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
    PaymentRequired:
      description: Not enough credits for this request. Top up at https://interapi.dev/en/pricing/.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            balance:
              summary: Out of credits
              value:
                detail: 'Insufficient balance: this request costs 6 credits, balance 2. Top up at interapi.dev/pricing'
                request_id: d33641f69d264233b867da8081d6fcca
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        X-Request-Cost:
          description: Price of the rejected request in credits.
          schema:
            type: integer
    Forbidden:
      description: Private content, or the account is disabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            private:
              summary: Private post
              value:
                detail: 'Instagram: this content is private'
                request_id: d33641f69d264233b867da8081d6fcca
            inactive:
              summary: Disabled account
              value:
                detail: Account inactive
                request_id: d33641f69d264233b867da8081d6fcca
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
    NotFound:
      description: The post was not found (deleted, private or unavailable). Costs at most 1 credit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found:
              summary: Post not found
              value:
                detail: 'Instagram: media not found — the post may be deleted, private or unavailable'
                request_id: d33641f69d264233b867da8081d6fcca
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
    ValidationFailed:
      description: A required query parameter is missing or invalid. Not charged.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            missing:
              summary: Missing `url`
              value:
                detail:
                - type: missing
                  loc:
                  - query
                  - url
                  msg: Field required
                  input: null
                request_id: d33641f69d264233b867da8081d6fcca
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
    TooManyRequests:
      description: Hourly limit of the free credits reached (30 requests per hour until the first top-up), or the
        source platform is rate limiting. Retry after the number of seconds in `Retry-After`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            hourly:
              summary: Hourly limit
              value:
                detail: 'Hourly limit (30 req/h) reached. Top up once to remove it: interapi.dev/pricing'
                request_id: d33641f69d264233b867da8081d6fcca
            upstream:
              summary: Source platform throttling
              value:
                detail: 'TikTok: upstream rate limit reached, retry in a few seconds'
                request_id: d33641f69d264233b867da8081d6fcca
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
    BadGateway:
      description: The source platform is temporarily unavailable. **Free of charge** - retry in a few seconds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unavailable:
              summary: Upstream error
              value:
                detail: TikTok is temporarily unavailable, try again later
                request_id: d33641f69d264233b867da8081d6fcca
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
    ServerError:
      description: Server error on our side. **Free of charge.**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              summary: Internal error
              value:
                detail: Internal Server Error
                request_id: d33641f69d264233b867da8081d6fcca
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
  schemas:
    MediaItem:
      type: object
      description: 'One downloadable file: a video, a photo or an audio track.'
      required:
      - type
      - url
      properties:
        type:
          type: string
          enum:
          - video
          - photo
          - audio
          description: Kind of file.
        url:
          type: string
          description: Direct URL of the file on the platform CDN. Signed links expire - download soon after the
            request.
        quality:
          type:
          - string
          - 'null'
          description: Human-readable quality label, e.g. `HD`, `720p`, `1440x1440`, `mp4 (720p) avc1`, `MP3`, `cover`.
          examples:
          - HD
        download_url:
          type:
          - string
          - 'null'
          description: Alternative proxy download link when the platform offers one.
        format_id:
          type:
          - string
          - 'null'
          description: Format id (itag for YouTube). Pass it as `format_id` to `GET /api/v1/youtube/file`.
          examples:
          - '140'
        height:
          type:
          - integer
          - 'null'
          description: Frame height in pixels (video only).
          examples:
          - 720
        ext:
          type:
          - string
          - 'null'
          description: 'File extension: `mp4`, `webm`, `m4a`, `opus`, `m3u8`, ...'
          examples:
          - mp4
        bitrate:
          type:
          - integer
          - 'null'
          description: Bitrate in bit/s when known.
          examples:
          - 133491
    SocialMediaResponse:
      type: object
      description: Metadata and direct media URLs of a post. Returned by every platform download endpoint.
      required:
      - status
      - platform
      - title
      - description
      - media
      - video_url
      - video_hd_url
      - music_url
      - thumbnail
      - duration_sec
      - author
      - channel_url
      - duration_ms
      properties:
        status:
          type: string
          const: success
          description: Always `success` for a 200 answer.
        platform:
          type: string
          description: Always `InterAPI`.
          examples:
          - InterAPI
        title:
          type: string
          description: Title or caption of the post. Empty string when the platform has none.
        description:
          type: string
          description: Description or caption text.
        media:
          type: array
          description: All downloadable files of the post, best quality first.
          items:
            $ref: '#/components/schemas/MediaItem'
        video_url:
          type:
          - string
          - 'null'
          description: Main video URL (a variant up to 720p when several exist). `null` when the post has no video.
        video_hd_url:
          type:
          - string
          - 'null'
          description: Best-quality video URL. `null` when the post has no video.
        music_url:
          type:
          - string
          - 'null'
          description: Separate MP3 audio track (TikTok). `null` otherwise.
        thumbnail:
          type:
          - string
          - 'null'
          description: Cover / preview image URL.
        duration_sec:
          type: integer
          description: Duration in seconds; `0` when unknown.
        author:
          type: string
          description: Author name or handle. Empty string when unknown.
        channel_url:
          type:
          - string
          - 'null'
          description: Author's channel / profile URL when available.
        duration_ms:
          type: integer
          description: Server processing time in milliseconds.
    AutoMediaResponse:
      description: Same shape as the matching platform endpoint plus `source`.
      allOf:
      - $ref: '#/components/schemas/SocialMediaResponse'
      - type: object
        required:
        - source
        properties:
          source:
            type: string
            enum:
            - instagram
            - tiktok
            - pinterest
            - youtube
            - likee
            - x
            - facebook
            - rutube
            description: Platform detected from the link.
    YouTubeSearchItem:
      type: object
      required:
      - id
      - title
      - url
      - author
      - channel_url
      - duration_sec
      - thumbnail
      - kind
      - is_music
      - view_count
      properties:
        id:
          type: string
          description: YouTube video / playlist / channel id.
        title:
          type: string
        url:
          type: string
          description: Link to the item on YouTube or YouTube Music. Pass it to `GET /api/v1/youtube`.
        author:
          type: string
          description: Channel or artist name.
        channel_url:
          type:
          - string
          - 'null'
        duration_sec:
          type: integer
          description: Duration in seconds; `0` for channels and live streams.
        thumbnail:
          type:
          - string
          - 'null'
        kind:
          type: string
          enum:
          - video
          - audio
          - playlist
          - channel
          - live
        is_music:
          type: boolean
          description: '`true` for YouTube Music results.'
        view_count:
          type:
          - integer
          - 'null'
    YouTubeSearchResponse:
      type: object
      required:
      - status
      - platform
      - query
      - filter
      - count
      - results
      - duration_ms
      properties:
        status:
          type: string
          const: success
        platform:
          type: string
          examples:
          - InterAPI
        query:
          type: string
          description: The normalised search query.
        filter:
          type: string
          enum:
          - video
          - music
          - playlist
          - channel
          - live
          - shorts
          - all
        count:
          type: integer
          description: Number of results returned.
        results:
          type: array
          items:
            $ref: '#/components/schemas/YouTubeSearchItem'
        duration_ms:
          type: integer
          description: Server processing time in milliseconds.
    ShazamTrack:
      type: object
      required:
      - title
      - artist
      - album
      - coverart
      - shazam_url
      - isrc
      - key
      - label
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
        coverart:
          type:
          - string
          - 'null'
          description: Cover art URL.
        shazam_url:
          type:
          - string
          - 'null'
          description: Track page on Shazam.
        isrc:
          type:
          - string
          - 'null'
          description: International Standard Recording Code.
        key:
          type:
          - string
          - 'null'
          description: Shazam track key.
        label:
          type: string
          description: '`Artist - Title`, or just the title.'
    ShazamResponse:
      type: object
      required:
      - status
      - platform
      - found
      - track
      - duration_ms
      properties:
        status:
          type: string
          enum:
          - success
          - not_found
        platform:
          type: string
          examples:
          - InterAPI
        found:
          type: boolean
          description: '`true` when a track was recognised.'
        track:
          oneOf:
          - $ref: '#/components/schemas/ShazamTrack'
          - type: 'null'
          description: Recognised track, `null` when `found` is `false`.
        duration_ms:
          type: integer
          description: Server processing time in milliseconds.
    AccountResponse:
      type: object
      required:
      - status
      - platform
      - master
      - key
      - plan
      - balance
      - cost_per_request
      - costs
      - usage
      - duration_ms
      properties:
        status:
          type: string
          const: success
        platform:
          type: string
          examples:
          - InterAPI
        master:
          type: boolean
          description: '`true` for internal unlimited keys.'
        key:
          type: object
          required:
          - prefix
          - label
          properties:
            prefix:
              type: string
              description: First characters of the key (the rest is never shown).
            label:
              type: string
            request_count:
              type:
              - integer
              - 'null'
              description: Requests made with this key.
            created_at:
              type:
              - string
              - 'null'
              format: date-time
            last_used_at:
              type:
              - string
              - 'null'
              format: date-time
        plan:
          type: object
          required:
          - id
          - name
          - unlimited
          properties:
            id:
              type: string
              examples:
              - free
            name:
              type: string
              examples:
              - Free Test
            hourly_limit:
              type:
              - integer
              - 'null'
              description: 'Requests per hour for plans with a limit (free credits: 30), otherwise `null`.'
            monthly_limit:
              type:
              - integer
              - 'null'
            unlimited:
              type: boolean
        balance:
          type:
          - integer
          - 'null'
          description: Remaining credits. `null` for unlimited keys.
        cost_per_request:
          type: integer
          description: The lowest price of a request in credits.
        costs:
          oneOf:
          - type: object
            additionalProperties:
              type: integer
          - type: 'null'
          description: 'Price in credits per API, e.g. `{"instagram": 6, "youtube": 15}`.'
        usage:
          type: object
          properties:
            hourly_used:
              type:
              - integer
              - 'null'
            hourly_limit:
              type:
              - integer
              - 'null'
            hourly_remaining:
              type:
              - integer
              - 'null'
            hourly_reset:
              type:
              - integer
              - 'null'
              description: Unix time when the hourly window resets.
            month:
              type:
              - integer
              - 'null'
              description: Requests this month.
            total:
              type:
              - integer
              - 'null'
              description: Requests in total.
        duration_ms:
          type: integer
    CatalogItem:
      type: object
      required:
      - id
      - name
      - description
      - method
      - path
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          description: Short description (Russian).
        method:
          type: string
          examples:
          - GET
        path:
          type: string
          examples:
          - /api/v1/instagram
        tags:
          type: array
          items:
            type: string
        example:
          type:
          - string
          - 'null'
        cost:
          type:
          - integer
          - 'null'
          description: Price in credits (`/api/v1/auto` - same as the detected platform).
    CatalogResponse:
      type: object
      required:
      - apis
      properties:
        apis:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
    ServiceStatus:
      type: object
      required:
      - id
      - name
      - path
      - status
      - requests_24h
      - errors_24h
      - success_rate
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        status:
          type: string
          enum:
          - operational
          - degraded
          - down
        requests_24h:
          type: integer
        errors_24h:
          type: integer
          description: 5xx answers in the last 24 hours.
        success_rate:
          type:
          - number
          - 'null'
          description: Percent of non-5xx answers, `null` without traffic.
    StatusResponse:
      type: object
      required:
      - status
      - services
      - updated_at
      properties:
        status:
          type: string
          enum:
          - operational
          - degraded
          - down
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        updated_at:
          type: string
          format: date-time
    HealthResponse:
      type: object
      required:
      - status
      - service
      properties:
        status:
          type: string
          examples:
          - ok
        service:
          type: string
          examples:
          - interapi
        cache:
          type: string
          examples:
          - redis
        db:
          type: string
          enum:
          - ok
          - error
        redis:
          type: string
          examples:
          - ok
    Error:
      type: object
      description: Error body used by every non-2xx answer.
      required:
      - detail
      properties:
        detail:
          type: string
          description: Human-readable error message.
        request_id:
          type: string
          description: Request id (also in the `X-Request-Id` header). Quote it when contacting support.
    ValidationError:
      type: object
      description: 'Error body of a `422` answer: a missing or invalid query parameter.'
      required:
      - detail
      properties:
        detail:
          type: array
          items:
            type: object
            required:
            - type
            - loc
            - msg
            properties:
              type:
                type: string
                examples:
                - missing
              loc:
                type: array
                items:
                  type:
                  - string
                  - integer
                examples:
                - - query
                  - url
              msg:
                type: string
                examples:
                - Field required
              input:
                description: The rejected value.
              ctx:
                type: object
                description: Validation context (limits etc.).
        request_id:
          type: string
