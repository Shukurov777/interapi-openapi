<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>InterAPI - Swagger UI (OpenAPI 3.1)</title>
  <meta name="description" content="Try the InterAPI social media downloader API (Instagram, TikTok, YouTube, X, Facebook, Pinterest, RuTube, Likee, Shazam) in Swagger UI.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://shukurov777.github.io/interapi-openapi/swagger.html">
  <link rel="icon" href="https://interapi.dev/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>body { margin: 0; }</style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "openapi.yaml",
      dom_id: "#swagger-ui",
      deepLinking: true,
      docExpansion: "list",
      tagsSorter: "alpha",
      operationsSorter: "alpha"
    });
  </script>
</body>
</html>
